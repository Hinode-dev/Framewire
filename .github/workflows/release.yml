name: Publish download site

# framewire.exe is built and attached to the GitHub Release by hand (it needs
# the NVIDIA Video Codec SDK, which only exists on the dev machine — not
# worth running a self-hosted runner just for that). Once a release is
# published, this copies its exe into `site/` and deploys to GitHub Pages —
# entirely on a GitHub-hosted runner, no local machine involved.
on:
  release:
    types: [published]

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download framewire.exe from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern framewire.exe \
            --dir site/download

      - name: Record release version
        run: echo "${{ github.event.release.tag_name }}" > site/download/version.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
