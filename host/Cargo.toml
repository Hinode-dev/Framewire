[package]
name = "framewire_host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "framewire"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1.0.104"
arboard = "3"
axum = "0.8.9"
base64 = "0.22"
bytes = "1.12.1"
futures-util = "0.3"
igd-next = { version = "0.15", features = ["aio_tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
nvidia-video-codec-sdk = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.17.2"
webrtc-ice = "0.17.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Graphics_DirectX", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT", "Foundation"] }
